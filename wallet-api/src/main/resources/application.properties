quarkus.http.port=8085

# PostgreSQL Database Connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=gullak_admin
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/gullak

#Ldap Connection
ldap.url=ldap://localhost:389
ldap.base-dn=dc=gullak,dc=bank
ldap.admin-dn=cn=admin,dc=gullak,dc=bank
ldap.admin-password=${LDAP_ADMIN_PASSWORD}
ldap.people-ou=ou=People
ldap.groups-ou=ou=Groups
quarkus.security.ldap.dir-context.url=ldap://localhost:389
quarkus.security.ldap.identity-mapping.search-base-dn=ou=People,dc=gullak,dc=bank

# JWT Signing - Private Key
smallrye.jwt.sign.key.location=keys/privateKey.pem

# JWT Verification - Public Key
mp.jwt.verify.publickey.location=keys/publicKey.pem

# JWT Issuer
mp.jwt.verify.issuer=gullak-wallet